<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"><title>OnlyFans bot subscriber share</title><desc>OnlyFans bot subscriber share: estimated 8-15% of subscriber accounts are bots or fakes, with breakdown by year and sub-tier</desc><metadata><x:xmpmeta xmlns:x="adobe:ns:meta/" x:xmptk="onlyfansstatistics.com embed-image-metadata"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"><rdf:Description rdf:about="" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/" xmlns:photoshop="http://ns.adobe.com/photoshop/1.0/" xmlns:plus="http://ns.useplus.org/ldf/xmp/1.0/" xmlns:Iptc4xmpCore="http://iptc.org/std/Iptc4xmpCore/1.0/xmlns/" xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/" xmlns:cc="http://creativecommons.org/ns#" xmlns:xmp="http://ns.adobe.com/xap/1.0/" xmp:CreatorTool="onlyfansstatistics.com chart builder" photoshop:Credit="onlyfansstatistics.com" photoshop:Source="https://onlyfansstatistics.com/embed/bot-share" xmpRights:Marked="True" xmpRights:WebStatement="https://onlyfansstatistics.com/license" Iptc4xmpExt:DigitalSourceType="http://cv.iptc.org/newscodes/digitalsourcetype/dataDrivenMedia" cc:license="https://creativecommons.org/licenses/by-sa/4.0/" cc:attributionName="onlyfansstatistics.com" cc:attributionURL="https://onlyfansstatistics.com/embed/bot-share"><dc:title><rdf:Alt><rdf:li xml:lang="x-default">OnlyFans bot subscriber share</rdf:li></rdf:Alt></dc:title><dc:description><rdf:Alt><rdf:li xml:lang="x-default">OnlyFans bot subscriber share: estimated 8-15% of subscriber accounts are bots or fakes, with breakdown by year and sub-tier</rdf:li></rdf:Alt></dc:description><dc:creator><rdf:Seq><rdf:li>onlyfansstatistics.com</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 onlyfansstatistics.com · CC BY-SA 4.0</rdf:li></rdf:Alt></dc:rights><dc:subject><rdf:Bag><rdf:li>OnlyFans</rdf:li><rdf:li>OnlyFans statistics</rdf:li><rdf:li>OnlyFans bot share</rdf:li><rdf:li>OnlyFans bot subscribers</rdf:li><rdf:li>OnlyFans' Bot Problem: 8-15% of Subscribers Are Fake</rdf:li><rdf:li>Free OnlyFans Stats Widgets</rdf:li><rdf:li>share</rdf:li><rdf:li>creator economy</rdf:li><rdf:li>2026</rdf:li><rdf:li>data visualization</rdf:li><rdf:li>chart</rdf:li></rdf:Bag></dc:subject><xmpRights:UsageTerms><rdf:Alt><rdf:li xml:lang="x-default">Free to reuse under CC BY-SA 4.0: credit onlyfansstatistics.com and link to the source page.</rdf:li></rdf:Alt></xmpRights:UsageTerms><plus:Licensor><rdf:Seq><rdf:li rdf:parseType="Resource"><plus:LicensorName>onlyfansstatistics.com</plus:LicensorName><plus:LicensorURL>https://onlyfansstatistics.com/license</plus:LicensorURL></rdf:li></rdf:Seq></plus:Licensor><Iptc4xmpCore:CreatorContactInfo rdf:parseType="Resource"><Iptc4xmpCore:CiUrlWork>https://onlyfansstatistics.com/</Iptc4xmpCore:CiUrlWork></Iptc4xmpCore:CreatorContactInfo></rdf:Description></rdf:RDF></x:xmpmeta></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1424"/>
      <stop offset="100%" stop-color="#0d1a2e"/>
    </linearGradient>
    <linearGradient id="botFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="55" font-size="22" font-weight="700" fill="#e8eef9">Estimated bot share of OnlyFans subscriber accounts</text>
  <text x="60" y="80" font-size="14" fill="#7c8aa3">Bot / fake subscriber estimates · 2021–2025 trajectory and 2025 breakdown by sub tier</text>

  <!-- Two-panel layout. Left panel: yearly trajectory. Right panel: 2025 by sub tier. -->

  <!-- LEFT PANEL: YoY bot share -->
  <text x="80" y="115" font-size="14" font-weight="700" fill="#fb923c" font-family="ui-monospace, monospace">YEARLY TREND · 2021–2025</text>

  <!-- Y axis 0-20% -->
  <!-- y maps 0% → 425, 20% → 145. range 280 over 20. per 5%: 70 -->
  <g font-size="11" fill="#7c8aa3" font-family="ui-monospace, monospace">
    <text x="75" y="150" text-anchor="end">20%</text>
    <line x1="80" y1="145" x2="540" y2="145" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="75" y="220" text-anchor="end">15%</text>
    <line x1="80" y1="215" x2="540" y2="215" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="75" y="290" text-anchor="end">10%</text>
    <line x1="80" y1="285" x2="540" y2="285" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="75" y="360" text-anchor="end">5%</text>
    <line x1="80" y1="355" x2="540" y2="355" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="75" y="430" text-anchor="end">0%</text>
    <line x1="80" y1="425" x2="540" y2="425" stroke="#1e2d44" stroke-width="1"/>
  </g>

  <!-- Data: 2021=3.5%, 2022=5.2%, 2023=7.8%, 2024=10.4%, 2025=11.5% (midpoint of 8-15% estimate)
       y = 425 - val*14
       3.5 → 376
       5.2 → 352
       7.8 → 316
       10.4 → 279
       11.5 → 264
       X positions: 2021=130, 2022=215, 2023=300, 2024=385, 2025=470
  -->

  <!-- Area + line -->
  <path d="M130,376 L215,352 L300,316 L385,279 L470,264 L470,425 L130,425 Z" fill="url(#botFill)"/>
  <path d="M130,376 L215,352 L300,316 L385,279 L470,264" fill="none" stroke="#fb923c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data dots and labels -->
  <g font-family="ui-monospace, monospace">
    <circle cx="130" cy="376" r="5" fill="#fb923c" stroke="#0d1a2e" stroke-width="2"/>
    <text x="130" y="362" text-anchor="middle" font-size="11" fill="#b8c5db">3.5%</text>

    <circle cx="215" cy="352" r="5" fill="#fb923c" stroke="#0d1a2e" stroke-width="2"/>
    <text x="215" y="338" text-anchor="middle" font-size="11" fill="#b8c5db">5.2%</text>

    <circle cx="300" cy="316" r="5" fill="#fb923c" stroke="#0d1a2e" stroke-width="2"/>
    <text x="300" y="302" text-anchor="middle" font-size="11" fill="#b8c5db">7.8%</text>

    <circle cx="385" cy="279" r="5" fill="#fb923c" stroke="#0d1a2e" stroke-width="2"/>
    <text x="385" y="265" text-anchor="middle" font-size="11" fill="#b8c5db">10.4%</text>

    <circle cx="470" cy="264" r="7" fill="#fb923c" stroke="#0d1a2e" stroke-width="2.5"/>
    <text x="470" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#e8eef9">11.5%</text>
  </g>

  <!-- X labels -->
  <g font-size="12" fill="#b8c5db" font-family="ui-monospace, monospace">
    <text x="130" y="445" text-anchor="middle">2021</text>
    <text x="215" y="445" text-anchor="middle">2022</text>
    <text x="300" y="445" text-anchor="middle">2023</text>
    <text x="385" y="445" text-anchor="middle">2024</text>
    <text x="470" y="445" text-anchor="middle" font-weight="700">2025</text>
  </g>

  <!-- Vertical divider -->
  <line x1="590" y1="105" x2="590" y2="450" stroke="#1e2d44" stroke-width="1"/>

  <!-- RIGHT PANEL: by sub tier 2025 -->
  <text x="620" y="115" font-size="14" font-weight="700" fill="#fb923c" font-family="ui-monospace, monospace">2025 BY SUBSCRIPTION TIER</text>

  <!-- Bars: bot share by sub-price tier
       Free trial subs: 24%
       $4.99-$9.99 subs: 18%
       $10-$19 subs: 11%
       $20-$49 subs: 6%
       $50+ subs: 3%
       Max 30% → width scale: width = pct/30 * 480 -->

  <!-- Free trial: 24% → 384 -->
  <g transform="translate(620, 145)">
    <text x="0" y="22" class="ink2" font-size="12" fill="#b8c5db" font-family="ui-monospace, monospace">Free trial</text>
    <rect x="120" y="5" width="384" height="28" rx="5" fill="#fb923c"/>
    <text x="514" y="25" font-size="13" font-weight="700" fill="#e8eef9" font-family="ui-monospace, monospace">24%</text>
  </g>

  <!-- $4.99-$9.99: 18% → 288 -->
  <g transform="translate(620, 195)">
    <text x="0" y="22" font-size="12" fill="#b8c5db" font-family="ui-monospace, monospace">$4.99-$9.99</text>
    <rect x="120" y="5" width="288" height="28" rx="5" fill="#fb923c" opacity="0.85"/>
    <text x="418" y="25" font-size="13" font-weight="700" fill="#e8eef9" font-family="ui-monospace, monospace">18%</text>
  </g>

  <!-- $10-$19: 11% → 176 -->
  <g transform="translate(620, 245)">
    <text x="0" y="22" font-size="12" fill="#b8c5db" font-family="ui-monospace, monospace">$10-$19</text>
    <rect x="120" y="5" width="176" height="28" rx="5" fill="#fb923c" opacity="0.7"/>
    <text x="306" y="25" font-size="13" font-weight="700" fill="#e8eef9" font-family="ui-monospace, monospace">11%</text>
  </g>

  <!-- $20-$49: 6% → 96 -->
  <g transform="translate(620, 295)">
    <text x="0" y="22" font-size="12" fill="#b8c5db" font-family="ui-monospace, monospace">$20-$49</text>
    <rect x="120" y="5" width="96" height="28" rx="5" fill="#fb923c" opacity="0.55"/>
    <text x="226" y="25" font-size="13" font-weight="700" fill="#e8eef9" font-family="ui-monospace, monospace">6%</text>
  </g>

  <!-- $50+: 3% → 48 -->
  <g transform="translate(620, 345)">
    <text x="0" y="22" font-size="12" fill="#b8c5db" font-family="ui-monospace, monospace">$50+</text>
    <rect x="120" y="5" width="48" height="28" rx="5" fill="#fb923c" opacity="0.4"/>
    <text x="178" y="25" font-size="13" font-weight="700" fill="#e8eef9" font-family="ui-monospace, monospace">3%</text>
  </g>

  <!-- X axis for right panel: 0%, 10%, 20%, 30% -->
  <g font-size="10" fill="#7c8aa3" font-family="ui-monospace, monospace">
    <text x="740" y="395" text-anchor="middle">0%</text>
    <text x="900" y="395" text-anchor="middle">10%</text>
    <text x="1060" y="395" text-anchor="middle">20%</text>
    <text x="1140" y="395" text-anchor="middle">30%</text>
  </g>

  <!-- Highlight callout: aggregate range -->
  <g transform="translate(60, 470)">
    <rect x="0" y="0" width="540" height="80" rx="10" fill="#1e2d44" stroke="#fb923c" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="20" y="28" font-size="13" font-weight="600" fill="#fb923c" font-family="ui-monospace, monospace">PANEL-DERIVED ESTIMATE · 2025</text>
    <text x="20" y="58" font-size="22" font-weight="800" fill="#fb923c" font-family="ui-monospace, monospace">8–15%</text>
    <text x="135" y="58" font-size="12" fill="#b8c5db">of OnlyFans sub accounts are bots/fake</text>
    <text x="135" y="75" font-size="11" fill="#7c8aa3">Wide range reflects estimation uncertainty across panels</text>
  </g>

  <!-- Right annotation: impact -->
  <g transform="translate(620, 470)">
    <text font-size="13" font-weight="600" fill="#fb923c" font-family="ui-monospace, monospace">FINANCIAL IMPACT</text>
    <text y="28" font-size="12" fill="#b8c5db">Avg creator loss: $40-180/mo in spam-blocked engagement</text>
    <text y="48" font-size="12" fill="#b8c5db">High-price subs largely bot-free; low-price &amp; trial subs disproportionately affected</text>
  </g>

  <!-- Bottom: attribution + branding -->
  <text x="60" y="585" font-size="11" fill="#7c8aa3">Source: onlyfansstatistics.com analysis · panel-derived estimate from agency platform data + risk-scoring proxies</text>
  <text x="1140" y="585" text-anchor="end" font-size="11" font-weight="600" fill="#36e1ff" font-family="ui-monospace, monospace">onlyfansstatistics.com/research/bot-subscriber-problem</text>
</svg>
