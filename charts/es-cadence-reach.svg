  <rect width="100%" height="100%" class="bg" rx="14"/>
  <text x="40" y="44" class="ink title">Engagement Signal™: cadence bands and the reach of 100,200 creators</text>
  <text x="40" y="66" class="ink2 subtitle">Bands from the ES interpretation table (posts per week) · reach = total likes per public profile, creator dataset June 2026</text>
  <text x="40" y="104" class="section ink3">ENGAGEMENT SIGNAL SCALE · POSTS PER WEEK</text>
  <rect x="41" y="150" width="35.33333333333334" height="36" rx="5" fill="#7c8aa3" opacity="0.9"/>
  <text x="58.66666666666667" y="173" text-anchor="middle" class="valb" fill="#0f1c30">0</text>
  <text x="40" y="204" class="label11 ink3">dormant</text>
  <rect x="78.33333333333334" y="150" width="110" height="36" rx="5" fill="#ff6b6b" opacity="0.9"/>
  <text x="133.33333333333334" y="173" text-anchor="middle" class="valb" fill="#0f1c30">1–3</text>
  <text x="133.33333333333334" y="138" text-anchor="middle" class="label ink2">Low cadence</text>
  <text x="96" y="204" class="label11 ink3">churn 3–5× the median</text>
  <rect x="190.33333333333334" y="150" width="110.00000000000003" height="36" rx="5" fill="#ffb347" opacity="0.9"/>
  <text x="245.33333333333337" y="173" text-anchor="middle" class="valb" fill="#0f1c30">4–6</text>
  <text x="245.33333333333337" y="138" text-anchor="middle" class="label ink2">Approaching</text>
  <rect x="302.33333333333337" y="150" width="147.33333333333331" height="36" rx="5" fill="#4ade80" opacity="0.9"/>
  <text x="376" y="173" text-anchor="middle" class="valb" fill="#0f1c30">7–10</text>
  <text x="376" y="138" text-anchor="middle" class="label ink2">Sweet spot</text>
  <text x="376" y="204" text-anchor="middle" class="label11 ink3">highest retention and per-post engagement</text>
  <rect x="451.6666666666667" y="150" width="184.66666666666669" height="36" rx="5" fill="#00b8d4" opacity="0.9"/>
  <text x="544" y="173" text-anchor="middle" class="valb" fill="#0f1c30">11–15</text>
  <text x="544" y="138" text-anchor="middle" class="label ink2">High cadence</text>
  <rect x="638.3333333333334" y="150" width="371.33333333333337" height="36" rx="5" fill="#ffb347" opacity="0.9"/>
  <text x="824" y="173" text-anchor="middle" class="valb" fill="#0f1c30">16–25</text>
  <text x="824" y="138" text-anchor="middle" class="label ink2">Dilution risk</text>
  <text x="824" y="204" text-anchor="middle" class="label11 ink3">per-post engagement falls 30–50 %</text>
  <rect x="1011.6666666666667" y="150" width="147.33333333333326" height="36" rx="5" fill="#ff6b6b" opacity="0.9"/>
  <text x="1085.3333333333335" y="173" text-anchor="middle" class="valb" fill="#0f1c30">26+</text>
  <text x="1085.3333333333335" y="138" text-anchor="middle" class="label ink2">Burnout</text>
  <text x="1160" y="204" text-anchor="end" class="label11 ink3">often precedes abandonment</text>
  <line x1="40" y1="190" x2="40" y2="194" class="axis"/>
  <line x1="226.66666666666669" y1="190" x2="226.66666666666669" y2="194" class="axis"/>
  <line x1="413.33333333333337" y1="190" x2="413.33333333333337" y2="194" class="axis"/>
  <line x1="600" y1="190" x2="600" y2="194" class="axis"/>
  <line x1="786.6666666666667" y1="190" x2="786.6666666666667" y2="194" class="axis"/>
  <line x1="973.3333333333334" y1="190" x2="973.3333333333334" y2="194" class="axis"/>
  <line x1="1160" y1="190" x2="1160" y2="194" class="axis"/>
  <text x="40" y="254" class="section ink3">REACH · TOTAL LIKES PER PROFILE · SHARE OF 100,200 CREATORS</text>
  <text x="151" y="287" text-anchor="end" class="val13 ink2">0–1K</text>
  <rect x="165" y="270" width="380.0" height="24" rx="4" fill="#36e1ff"/>
  <text x="555" y="287" class="val13 ink">50.8 % · 50,917 profiles</text>
  <text x="151" y="331" text-anchor="end" class="val13 ink2">1K–10K</text>
  <rect x="165" y="314" width="178.0" height="24" rx="4" fill="#00b8d4"/>
  <text x="353.0314960629921" y="331" class="val13 ink">23.8 % · 23,872 profiles</text>
  <text x="151" y="375" text-anchor="end" class="val13 ink2">10K–100K</text>
  <rect x="165" y="358" width="148.9" height="24" rx="4" fill="#00b8d4"/>
  <text x="323.8582677165354" y="375" class="val13 ink">19.9 % · 19,921 profiles</text>
  <text x="151" y="419" text-anchor="end" class="val13 ink2">100K–1M</text>
  <rect x="165" y="402" width="38.9" height="24" rx="4" fill="#00b8d4"/>
  <text x="213.89763779527559" y="419" class="val13 ink">5.2 % · 5,259 profiles</text>
  <text x="151" y="463" text-anchor="end" class="val13 ink2">1M+</text>
  <rect x="165" y="446" width="3.0" height="24" rx="4" fill="#00b8d4"/>
  <text x="178" y="463" class="val13 ink">0.2 % · 231 profiles</text>
  <rect x="760" y="262" width="400" height="190" rx="10" fill="#14253f"/>
  <text x="780" y="292" class="big ink">Like concentration</text>
  <text x="780" y="322" class="label13 ink2">Median profile: 906 likes · average 25,705</text>
  <text x="780" y="346" class="label13 ink2">p90: 49,099 · p99: 428,780 likes</text>
  <text x="780" y="370" class="label13 ink2">p99 out-reaches the median 473×</text>
  <text x="780" y="394" class="label13 ink2">Top 1 % of creators hold 35.5 % of all likes</text>
  <text x="780" y="418" class="label13 ink2">Top 10 % hold 82 % — the ES benchmark curve</text>

  <text x="40" y="582" class="ink3 footer">Cadence bands: ES methodology page · reach data: bestonlyfansreviews.com × onlyfansstatistics.com, 100,200 public profiles, June 2026 · CC BY-SA 4.0</text>
