  <title>Creator Velocity Index™: how revenue and cadence become a 0–100 score</title>
  <desc>CVI = clamp(50 × log₁₀(gross ÷ niche median + 1) × cadence factor + 30, 0, 100) · cadence factor = 1 − |posts/week − 7| ÷ 30</desc>
