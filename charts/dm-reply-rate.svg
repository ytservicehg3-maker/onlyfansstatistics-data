<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"><title>OnlyFans DM reply rate declining from 67% in 2023 to 38% in 2025 — a -43% relative decline over 24 months</title><desc>OnlyFans DM reply rate declining from 67% in 2023 to 38% in 2025 — a -43% relative decline over 24 months</desc><metadata><x:xmpmeta xmlns:x="adobe:ns:meta/" x:xmptk="onlyfansstatistics.com embed-image-metadata"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"><rdf:Description rdf:about="" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/" xmlns:photoshop="http://ns.adobe.com/photoshop/1.0/" xmlns:plus="http://ns.useplus.org/ldf/xmp/1.0/" xmlns:Iptc4xmpCore="http://iptc.org/std/Iptc4xmpCore/1.0/xmlns/" xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/" xmlns:cc="http://creativecommons.org/ns#" xmlns:xmp="http://ns.adobe.com/xap/1.0/" xmp:CreatorTool="onlyfansstatistics.com chart builder" photoshop:Credit="onlyfansstatistics.com" photoshop:Source="https://onlyfansstatistics.com/embed/dm-reply-rate" xmpRights:Marked="True" xmpRights:WebStatement="https://onlyfansstatistics.com/license" Iptc4xmpExt:DigitalSourceType="http://cv.iptc.org/newscodes/digitalsourcetype/dataDrivenMedia" cc:license="https://creativecommons.org/licenses/by-sa/4.0/" cc:attributionName="onlyfansstatistics.com" cc:attributionURL="https://onlyfansstatistics.com/embed/dm-reply-rate"><dc:title><rdf:Alt><rdf:li xml:lang="x-default">OnlyFans DM reply rate declining from 67% in 2023 to 38% in 2025 — a -43% relative decline over 24 months</rdf:li></rdf:Alt></dc:title><dc:description><rdf:Alt><rdf:li xml:lang="x-default">OnlyFans DM reply rate declining from 67% in 2023 to 38% in 2025 — a -43% relative decline over 24 months</rdf:li></rdf:Alt></dc:description><dc:creator><rdf:Seq><rdf:li>onlyfansstatistics.com</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 onlyfansstatistics.com · CC BY-SA 4.0</rdf:li></rdf:Alt></dc:rights><dc:subject><rdf:Bag><rdf:li>OnlyFans</rdf:li><rdf:li>OnlyFans statistics</rdf:li><rdf:li>OnlyFans dm reply rate</rdf:li><rdf:li>OnlyFans DM reply rate collapse</rdf:li><rdf:li>DM Death: OnlyFans Reply Rates Crash from 67% to 38%</rdf:li><rdf:li>Free OnlyFans Stats Widgets</rdf:li><rdf:li>reply</rdf:li><rdf:li>rate</rdf:li><rdf:li>creator economy</rdf:li><rdf:li>2026</rdf:li><rdf:li>data visualization</rdf:li><rdf:li>chart</rdf:li></rdf:Bag></dc:subject><xmpRights:UsageTerms><rdf:Alt><rdf:li xml:lang="x-default">Free to reuse under CC BY-SA 4.0: credit onlyfansstatistics.com and link to the source page.</rdf:li></rdf:Alt></xmpRights:UsageTerms><plus:Licensor><rdf:Seq><rdf:li rdf:parseType="Resource"><plus:LicensorName>onlyfansstatistics.com</plus:LicensorName><plus:LicensorURL>https://onlyfansstatistics.com/license</plus:LicensorURL></rdf:li></rdf:Seq></plus:Licensor><Iptc4xmpCore:CreatorContactInfo rdf:parseType="Resource"><Iptc4xmpCore:CiUrlWork>https://onlyfansstatistics.com/</Iptc4xmpCore:CiUrlWork></Iptc4xmpCore:CreatorContactInfo></rdf:Description></rdf:RDF></x:xmpmeta></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1424"/>
      <stop offset="100%" stop-color="#0d1a2e"/>
    </linearGradient>
    <linearGradient id="declineFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="55" font-size="22" font-weight="700" fill="#e8eef9">OnlyFans DM reply rate · 24-month decline</text>
  <text x="60" y="80" font-size="14" fill="#7c8aa3">% of opened DMs that receive a fan reply · monthly cohort · Q1 2023 → Q1 2025</text>

  <!-- Y-axis 30% → 70% -->
  <!-- y maps: 70% → 125, 30% → 405. range = 280 over 40%. per 5%: 35 -->
  <g font-size="12" fill="#7c8aa3" font-family="ui-monospace, monospace">
    <text x="55" y="130" text-anchor="end">70%</text>
    <line x1="60" y1="125" x2="1140" y2="125" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="55" y="200" text-anchor="end">60%</text>
    <line x1="60" y1="195" x2="1140" y2="195" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="55" y="270" text-anchor="end">50%</text>
    <line x1="60" y1="265" x2="1140" y2="265" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="55" y="340" text-anchor="end">40%</text>
    <line x1="60" y1="335" x2="1140" y2="335" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="55" y="410" text-anchor="end">30%</text>
    <line x1="60" y1="405" x2="1140" y2="405" stroke="#1e2d44" stroke-width="1"/>
  </g>

  <!-- Data points monthly:
       Q1-23: 67, Q2-23: 64, Q3-23: 60, Q4-23: 56,
       Q1-24: 52, Q2-24: 49, Q3-24: 45, Q4-24: 42,
       Q1-25: 38
       y = 405 - (val-30)*7 -->

  <!-- X positions: even spacing over 9 quarters between x=140 to x=1100
       step = (1100-140)/8 = 120 -->

  <!-- Line + fill -->
  <path d="M140,146 L260,167 L380,195 L500,223 L620,251 L740,272 L860,300 L980,321 L1100,349 L1100,405 L140,405 Z" fill="url(#declineFill)"/>
  <path d="M140,146 L260,167 L380,195 L500,223 L620,251 L740,272 L860,300 L980,321 L1100,349" fill="none" stroke="#f87171" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data point dots & labels -->
  <g font-family="ui-monospace, monospace">
    <circle cx="140" cy="146" r="6" fill="#f87171" stroke="#0d1a2e" stroke-width="2.5"/>
    <text x="140" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#e8eef9">67%</text>

    <circle cx="260" cy="167" r="5" fill="#f87171" stroke="#0d1a2e" stroke-width="2"/>
    <text x="260" y="152" text-anchor="middle" font-size="11" fill="#b8c5db">64%</text>

    <circle cx="380" cy="195" r="5" fill="#f87171" stroke="#0d1a2e" stroke-width="2"/>
    <text x="380" y="180" text-anchor="middle" font-size="11" fill="#b8c5db">60%</text>

    <circle cx="500" cy="223" r="5" fill="#f87171" stroke="#0d1a2e" stroke-width="2"/>
    <text x="500" y="208" text-anchor="middle" font-size="11" fill="#b8c5db">56%</text>

    <circle cx="620" cy="251" r="6" fill="#f87171" stroke="#0d1a2e" stroke-width="2.5"/>
    <text x="620" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#e8eef9">52%</text>

    <circle cx="740" cy="272" r="5" fill="#f87171" stroke="#0d1a2e" stroke-width="2"/>
    <text x="740" y="257" text-anchor="middle" font-size="11" fill="#b8c5db">49%</text>

    <circle cx="860" cy="300" r="5" fill="#f87171" stroke="#0d1a2e" stroke-width="2"/>
    <text x="860" y="285" text-anchor="middle" font-size="11" fill="#b8c5db">45%</text>

    <circle cx="980" cy="321" r="5" fill="#f87171" stroke="#0d1a2e" stroke-width="2"/>
    <text x="980" y="306" text-anchor="middle" font-size="11" fill="#b8c5db">42%</text>

    <circle cx="1100" cy="349" r="8" fill="#f87171" stroke="#0d1a2e" stroke-width="2.5"/>
    <text x="1100" y="333" text-anchor="middle" font-size="14" font-weight="700" fill="#e8eef9">38%</text>
  </g>

  <!-- X-axis labels -->
  <g font-size="12" fill="#b8c5db" font-family="ui-monospace, monospace">
    <text x="140" y="438" text-anchor="middle" font-weight="700">Q1 2023</text>
    <text x="260" y="438" text-anchor="middle">Q2</text>
    <text x="380" y="438" text-anchor="middle">Q3</text>
    <text x="500" y="438" text-anchor="middle">Q4</text>
    <text x="620" y="438" text-anchor="middle" font-weight="700">Q1 2024</text>
    <text x="740" y="438" text-anchor="middle">Q2</text>
    <text x="860" y="438" text-anchor="middle">Q3</text>
    <text x="980" y="438" text-anchor="middle">Q4</text>
    <text x="1100" y="438" text-anchor="middle" font-weight="700">Q1 2025</text>
  </g>

  <!-- Highlight callout: relative decline -->
  <g transform="translate(720, 478)">
    <rect x="0" y="0" width="430" height="90" rx="10" fill="#1e2d44" stroke="#f87171" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="20" y="30" font-size="14" font-weight="600" fill="#f87171" font-family="ui-monospace, monospace">24-MONTH RELATIVE DECLINE</text>
    <text x="20" y="60" font-size="22" font-weight="800" fill="#f87171" font-family="ui-monospace, monospace">−43%</text>
    <text x="120" y="60" font-size="12" fill="#b8c5db">67% → 38% reply rate</text>
    <text x="120" y="78" font-size="11" fill="#7c8aa3">−1.2 percentage points per month</text>
  </g>

  <!-- Lower-left annotation: drivers -->
  <g transform="translate(60, 478)">
    <text font-size="13" font-weight="600" fill="#f87171" font-family="ui-monospace, monospace">THREE DRIVERS</text>
    <text y="28" font-size="12" fill="#b8c5db">1. AI-bot saturation: outbound DM spam normalized fans to ignoring</text>
    <text y="48" font-size="12" fill="#b8c5db">2. Fan over-subscription: avg fan subscribed to 14 creators (vs 8 in 2023)</text>
    <text y="68" font-size="12" fill="#b8c5db">3. Declining novelty effect: mass-DM playbook over-used</text>
  </g>

  <!-- Bottom: attribution + branding -->
  <text x="60" y="585" font-size="11" fill="#7c8aa3">Source: onlyfansstatistics.com analysis · agency DM-platform panel + in-app analytics</text>
  <text x="1140" y="585" text-anchor="end" font-size="11" font-weight="600" fill="#36e1ff" font-family="ui-monospace, monospace">onlyfansstatistics.com/research/dm-engagement-decline</text>
</svg>
