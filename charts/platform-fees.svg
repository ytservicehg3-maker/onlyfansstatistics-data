<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Creator platform fees — what each platform takes" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"><metadata><x:xmpmeta xmlns:x="adobe:ns:meta/" x:xmptk="onlyfansstatistics.com embed-image-metadata"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"><rdf:Description rdf:about="" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/" xmlns:photoshop="http://ns.adobe.com/photoshop/1.0/" xmlns:plus="http://ns.useplus.org/ldf/xmp/1.0/" xmlns:Iptc4xmpCore="http://iptc.org/std/Iptc4xmpCore/1.0/xmlns/" xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/" xmlns:cc="http://creativecommons.org/ns#" xmlns:xmp="http://ns.adobe.com/xap/1.0/" xmp:CreatorTool="onlyfansstatistics.com chart builder" photoshop:Credit="onlyfansstatistics.com" photoshop:Source="https://onlyfansstatistics.com/embed/platform-fees" xmpRights:Marked="True" xmpRights:WebStatement="https://onlyfansstatistics.com/license" Iptc4xmpExt:DigitalSourceType="http://cv.iptc.org/newscodes/digitalsourcetype/dataDrivenMedia" cc:license="https://creativecommons.org/licenses/by-sa/4.0/" cc:attributionName="onlyfansstatistics.com" cc:attributionURL="https://onlyfansstatistics.com/embed/platform-fees"><dc:title><rdf:Alt><rdf:li xml:lang="x-default">OnlyFans creator platform fee comparison</rdf:li></rdf:Alt></dc:title><dc:description><rdf:Alt><rdf:li xml:lang="x-default">Creator platform fee comparison: OnlyFans 20%, Twitch up to 50%, Patreon 5-12%, YouTube 45%, Cameo 25%, Substack 10%, Gumroad 10%</rdf:li></rdf:Alt></dc:description><dc:creator><rdf:Seq><rdf:li>onlyfansstatistics.com</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 onlyfansstatistics.com · CC BY-SA 4.0</rdf:li></rdf:Alt></dc:rights><dc:subject><rdf:Bag><rdf:li>OnlyFans</rdf:li><rdf:li>OnlyFans statistics</rdf:li><rdf:li>OnlyFans platform fees</rdf:li><rdf:li>Platform fees compared</rdf:li><rdf:li>OnlyFans vs Patreon vs Fansly: Platform Fees Compared (2026)</rdf:li><rdf:li>Free OnlyFans Stats Widgets</rdf:li><rdf:li>platform</rdf:li><rdf:li>fees</rdf:li><rdf:li>creator economy</rdf:li><rdf:li>2026</rdf:li><rdf:li>data visualization</rdf:li><rdf:li>chart</rdf:li></rdf:Bag></dc:subject><xmpRights:UsageTerms><rdf:Alt><rdf:li xml:lang="x-default">Free to reuse under CC BY-SA 4.0: credit onlyfansstatistics.com and link to the source page.</rdf:li></rdf:Alt></xmpRights:UsageTerms><plus:Licensor><rdf:Seq><rdf:li rdf:parseType="Resource"><plus:LicensorName>onlyfansstatistics.com</plus:LicensorName><plus:LicensorURL>https://onlyfansstatistics.com/license</plus:LicensorURL></rdf:li></rdf:Seq></plus:Licensor><Iptc4xmpCore:CreatorContactInfo rdf:parseType="Resource"><Iptc4xmpCore:CiUrlWork>https://onlyfansstatistics.com/</Iptc4xmpCore:CiUrlWork></Iptc4xmpCore:CreatorContactInfo></rdf:Description></rdf:RDF></x:xmpmeta></metadata>
  <title>Creator platform fees comparison</title>
  <desc>Platform fee as percentage of creator gross — major creator-economy platforms · 2025</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1424"/>
      <stop offset="100%" stop-color="#0d1a2e"/>
    </linearGradient>
  </defs>
  <style>
    .grid { stroke: rgba(255,255,255,0.06); stroke-width: 1; }
    .axis { stroke: rgba(255,255,255,0.12); stroke-width: 1; }
    .ink { fill: #e8eef9; }
    .ink2 { fill: #b8c5db; }
    .ink3 { fill: #7c8aa3; }
    .num { font-family: ui-monospace, "JetBrains Mono", monospace; font-feature-settings: "tnum"; }
    .title { font-size: 22px; font-weight: 700; }
    .subtitle { font-size: 14px; }
    .axislabel { font-size: 13px; }
    .valuelabel { font-size: 13px; font-weight: 700; }
    .footer { font-size: 11px; }
    .note { font-size: 12px; }
  </style>

  <rect width="1200" height="600" fill="url(#bg)" rx="14"/>

  <!-- Title -->
  <text x="60" y="55" class="ink title">Creator platform fees — what each platform takes</text>
  <text x="60" y="80" class="ink3 subtitle">Headline fee as % of creator gross · 2025 published rates</text>

  <!-- X-axis (0% to 60%), Y starts at 130 -->
  <!-- y = 130 + i * 50 for each platform. Bar height 36, width = pct / 60 * 800. -->
  <!-- Layout: label at x=240 right-aligned, bar starts at 260, max width 800, ends at 1060 -->
  <!-- 0%, 10%, 20%, 30%, 40%, 50%, 60% gridlines -->

  <g class="grid">
    <line x1="260" y1="115" x2="260" y2="510" class="axis"/>
    <line x1="393" y1="115" x2="393" y2="510"/>
    <line x1="526" y1="115" x2="526" y2="510"/>
    <line x1="660" y1="115" x2="660" y2="510"/>
    <line x1="793" y1="115" x2="793" y2="510"/>
    <line x1="926" y1="115" x2="926" y2="510"/>
    <line x1="1060" y1="115" x2="1060" y2="510" class="axis"/>
  </g>
  <g class="num ink3" font-size="11">
    <text x="260" y="528" text-anchor="middle">0%</text>
    <text x="393" y="528" text-anchor="middle">10%</text>
    <text x="526" y="528" text-anchor="middle">20%</text>
    <text x="660" y="528" text-anchor="middle">30%</text>
    <text x="793" y="528" text-anchor="middle">40%</text>
    <text x="926" y="528" text-anchor="middle">50%</text>
    <text x="1060" y="528" text-anchor="middle">60%</text>
  </g>

  <!-- Bars: each width = pct/60 * 800
       Patreon 5%:   width 66.7
       Substack 10%: width 133.3
       Gumroad 10%:  width 133.3
       OnlyFans 20%: width 266.7  *HIGHLIGHT*
       Cameo 25%:    width 333.3
       YouTube 45%:  width 600
       Twitch 50%:   width 666.7
  -->

  <!-- Patreon -->
  <g transform="translate(0,130)">
    <text x="250" y="22" text-anchor="end" class="ink2 axislabel">Patreon</text>
    <rect x="260" y="3" width="66.7" height="36" rx="6" fill="#4ade80"/>
    <text x="336" y="26" class="num ink valuelabel">5–12%</text>
    <text x="510" y="26" class="ink3" font-size="11">tier-based · creator-friendly</text>
  </g>

  <!-- Substack -->
  <g transform="translate(0,180)">
    <text x="250" y="22" text-anchor="end" class="ink2 axislabel">Substack</text>
    <rect x="260" y="3" width="133.3" height="36" rx="6" fill="#4ade80"/>
    <text x="403" y="26" class="num ink valuelabel">10%</text>
    <text x="510" y="26" class="ink3" font-size="11">+ Stripe processing</text>
  </g>

  <!-- Gumroad -->
  <g transform="translate(0,230)">
    <text x="250" y="22" text-anchor="end" class="ink2 axislabel">Gumroad</text>
    <rect x="260" y="3" width="133.3" height="36" rx="6" fill="#4ade80"/>
    <text x="403" y="26" class="num ink valuelabel">10%</text>
    <text x="510" y="26" class="ink3" font-size="11">flat-rate · payment fee separate</text>
  </g>

  <!-- OnlyFans HIGHLIGHTED -->
  <g transform="translate(0,280)">
    <text x="250" y="22" text-anchor="end" class="ink2 axislabel" font-weight="700">OnlyFans</text>
    <rect x="260" y="3" width="266.7" height="36" rx="6" fill="#36e1ff"/>
    <text x="536" y="26" class="num ink valuelabel" fill="#36e1ff">20%</text>
    <text x="630" y="26" class="ink2" font-size="11" font-weight="600">★ flat platform fee · no tier penalties</text>
  </g>

  <!-- Cameo -->
  <g transform="translate(0,330)">
    <text x="250" y="22" text-anchor="end" class="ink2 axislabel">Cameo</text>
    <rect x="260" y="3" width="333.3" height="36" rx="6" fill="#fbbf24"/>
    <text x="603" y="26" class="num ink valuelabel">25%</text>
    <text x="710" y="26" class="ink3" font-size="11">per-booking</text>
  </g>

  <!-- YouTube AdSense -->
  <g transform="translate(0,380)">
    <text x="250" y="22" text-anchor="end" class="ink2 axislabel">YouTube (AdSense)</text>
    <rect x="260" y="3" width="600" height="36" rx="6" fill="#f87171"/>
    <text x="870" y="26" class="num ink valuelabel">45%</text>
    <text x="950" y="26" class="ink3" font-size="11">ad-revenue share</text>
  </g>

  <!-- Twitch -->
  <g transform="translate(0,430)">
    <text x="250" y="22" text-anchor="end" class="ink2 axislabel">Twitch (subs)</text>
    <rect x="260" y="3" width="666.7" height="36" rx="6" fill="#f87171"/>
    <text x="936" y="26" class="num ink valuelabel">50%</text>
    <text x="1010" y="26" class="ink3" font-size="11">30% on bits</text>
  </g>

  <!-- Highlight callout box -->
  <g transform="translate(580, 80)">
    <rect x="0" y="0" width="540" height="38" rx="8" fill="rgba(54,225,255,0.10)" stroke="#36e1ff" stroke-width="1" stroke-opacity="0.6"/>
    <text x="20" y="24" class="num ink2" font-size="13" font-weight="600">OnlyFans' 20% fee is</text>
    <text x="185" y="24" class="num" font-size="14" font-weight="800" fill="#36e1ff">2.5×</text>
    <text x="220" y="24" class="num ink2" font-size="13">lower than Twitch · saving creators ~$1.4B/yr</text>
  </g>

  <!-- Footer attribution -->
  <text x="60" y="563" class="ink3 note">Notes: YouTube AdSense uses the channel-side split. Twitch standard partner sub-split is 50/50; bits 30/70. Patreon range reflects 5% (Lite) to 12% (Premium).</text>
  <text x="60" y="585" class="ink3 footer">Source: onlyfansstatistics.com analysis · platform-published fee schedules · 2025</text>
  <text x="1140" y="585" text-anchor="end" class="num footer" fill="#36e1ff" font-weight="600">onlyfansstatistics.com/research/platform-fees-comparison</text>
</svg>
