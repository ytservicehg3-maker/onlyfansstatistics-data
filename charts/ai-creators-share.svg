<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" width="1200" height="624" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"><title>AI-generated creator share of new OnlyFans accounts</title><desc>AI-generated creator share of new OnlyFans accounts: 0.0% (2022), 0.3% (2023), 4.1% (2024), 12.0% (2025) — 40× growth in 24 months</desc><metadata><x:xmpmeta xmlns:x="adobe:ns:meta/" x:xmptk="onlyfansstatistics.com embed-image-metadata"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"><rdf:Description rdf:about="" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/" xmlns:photoshop="http://ns.adobe.com/photoshop/1.0/" xmlns:plus="http://ns.useplus.org/ldf/xmp/1.0/" xmlns:Iptc4xmpCore="http://iptc.org/std/Iptc4xmpCore/1.0/xmlns/" xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/" xmlns:cc="http://creativecommons.org/ns#" xmlns:xmp="http://ns.adobe.com/xap/1.0/" xmp:CreatorTool="onlyfansstatistics.com chart builder" photoshop:Credit="onlyfansstatistics.com" photoshop:Source="https://onlyfansstatistics.com/embed/ai-creators-share" xmpRights:Marked="True" xmpRights:WebStatement="https://onlyfansstatistics.com/license" Iptc4xmpExt:DigitalSourceType="http://cv.iptc.org/newscodes/digitalsourcetype/dataDrivenMedia" cc:license="https://creativecommons.org/licenses/by-sa/4.0/" cc:attributionName="onlyfansstatistics.com" cc:attributionURL="https://onlyfansstatistics.com/embed/ai-creators-share"><dc:title><rdf:Alt><rdf:li xml:lang="x-default">AI-generated creator share of new OnlyFans accounts</rdf:li></rdf:Alt></dc:title><dc:description><rdf:Alt><rdf:li xml:lang="x-default">AI-generated creator share of new OnlyFans accounts: 0.0% (2022), 0.3% (2023), 4.1% (2024), 12.0% (2025) — 40× growth in 24 months</rdf:li></rdf:Alt></dc:description><dc:creator><rdf:Seq><rdf:li>onlyfansstatistics.com</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 onlyfansstatistics.com · CC BY-SA 4.0</rdf:li></rdf:Alt></dc:rights><dc:subject><rdf:Bag><rdf:li>OnlyFans</rdf:li><rdf:li>OnlyFans statistics</rdf:li><rdf:li>OnlyFans ai creators share</rdf:li><rdf:li>AI-generated OnlyFans creators: 12% of new accounts in 2025</rdf:li><rdf:li>AI Creators Captured 12% of OnlyFans New Accounts in 2025</rdf:li><rdf:li>Free OnlyFans Stats Widgets</rdf:li><rdf:li>creators</rdf:li><rdf:li>share</rdf:li><rdf:li>creator economy</rdf:li><rdf:li>2026</rdf:li><rdf:li>data visualization</rdf:li><rdf:li>chart</rdf:li></rdf:Bag></dc:subject><xmpRights:UsageTerms><rdf:Alt><rdf:li xml:lang="x-default">Free to reuse under CC BY-SA 4.0: credit onlyfansstatistics.com and link to the source page.</rdf:li></rdf:Alt></xmpRights:UsageTerms><plus:Licensor><rdf:Seq><rdf:li rdf:parseType="Resource"><plus:LicensorName>onlyfansstatistics.com</plus:LicensorName><plus:LicensorURL>https://onlyfansstatistics.com/license</plus:LicensorURL></rdf:li></rdf:Seq></plus:Licensor><Iptc4xmpCore:CreatorContactInfo rdf:parseType="Resource"><Iptc4xmpCore:CiUrlWork>https://onlyfansstatistics.com/</Iptc4xmpCore:CiUrlWork></Iptc4xmpCore:CreatorContactInfo></rdf:Description></rdf:RDF></x:xmpmeta></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1424"/>
      <stop offset="100%" stop-color="#0d1a2e"/>
    </linearGradient>
    <linearGradient id="aiBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="aiArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="624" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="55" font-size="22" font-weight="700" fill="#e8eef9">AI-generated creators: share of new OnlyFans accounts</text>
  <text x="60" y="80" font-size="14" fill="#7c8aa3">Annual % of new sign-ups · 2022–2025 · acceleration phase</text>

  <!-- Y-axis grid: 0%, 3%, 6%, 9%, 12%, 15% -->
  <g font-size="12" fill="#7c8aa3" font-family="ui-monospace, monospace">
    <text x="55" y="135" text-anchor="end">15%</text>
    <line x1="60" y1="130" x2="1140" y2="130" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="55" y="200" text-anchor="end">12%</text>
    <line x1="60" y1="195" x2="1140" y2="195" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>
    <text x="55" y="265" text-anchor="end">9%</text>
    <line x1="60" y1="260" x2="1140" y2="260" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="55" y="330" text-anchor="end">6%</text>
    <line x1="60" y1="325" x2="1140" y2="325" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="55" y="395" text-anchor="end">3%</text>
    <line x1="60" y1="390" x2="1140" y2="390" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="55" y="460" text-anchor="end">0%</text>
    <line x1="60" y1="455" x2="1140" y2="455" stroke="#1e2d44" stroke-width="1"/>
  </g>

  <!-- Data:
       2022: 0.0% → y = 455
       2023: 0.3% → y = 455 - 0.3 * (325/15) = 455 - 6.5 = 448.5 → 449
       2024: 4.1% → y = 455 - 4.1 * 21.67 = 455 - 88.8 = 366
       2025: 12.0% → y = 455 - 12.0 * 21.67 = 455 - 260 = 195
       (Y scale: 0% = 455, 15% = 130, so 1% = 21.67 px)
       X positions: 2022=180, 2023=460, 2024=740, 2025=1020
  -->

  <!-- Bars -->
  <g>
    <!-- 2022 bar (basically zero, just visible) -->
    <rect x="155" y="453" width="50" height="2" fill="url(#aiBar)" rx="2"/>
    <text x="180" y="448" text-anchor="middle" font-size="13" font-weight="700" fill="#a78bfa" font-family="ui-monospace, monospace">&lt;0.1%</text>

    <!-- 2023 bar -->
    <rect x="435" y="449" width="50" height="6" fill="url(#aiBar)" rx="2"/>
    <text x="460" y="438" text-anchor="middle" font-size="13" font-weight="700" fill="#a78bfa" font-family="ui-monospace, monospace">0.3%</text>

    <!-- 2024 bar -->
    <rect x="715" y="366" width="50" height="89" fill="url(#aiBar)" rx="2"/>
    <text x="740" y="355" text-anchor="middle" font-size="15" font-weight="700" fill="#a78bfa" font-family="ui-monospace, monospace">4.1%</text>

    <!-- 2025 bar (the big one) -->
    <rect x="995" y="195" width="50" height="260" fill="url(#aiBar)" rx="2"/>
    <text x="1020" y="184" text-anchor="middle" font-size="18" font-weight="800" fill="#a78bfa" font-family="ui-monospace, monospace">12.0%</text>
  </g>

  <!-- Growth annotations between bars -->
  <g font-family="ui-monospace, monospace" font-size="11" fill="#a78bfa">
    <text x="320" y="478" text-anchor="middle">+0.3pp</text>
    <text x="600" y="478" text-anchor="middle">+3.8pp YoY</text>
    <text x="880" y="478" text-anchor="middle" font-weight="700" font-size="13">+7.9pp YoY</text>
  </g>

  <!-- X-axis labels -->
  <g font-size="13" font-weight="600" fill="#b8c5db" font-family="ui-monospace, monospace">
    <text x="180" y="500" text-anchor="middle">2022</text>
    <text x="460" y="500" text-anchor="middle">2023</text>
    <text x="740" y="500" text-anchor="middle">2024</text>
    <text x="1020" y="500" text-anchor="middle">2025</text>
  </g>

  <!-- Hook callout: 40x growth in 24 months -->
  <g transform="translate(720, 520)">
    <rect x="0" y="0" width="420" height="60" rx="10" fill="#1e2d44" stroke="#a78bfa" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="20" y="25" font-size="12" font-weight="600" fill="#a78bfa" font-family="ui-monospace, monospace">24-MONTH GROWTH</text>
    <text x="20" y="48" font-size="20" font-weight="800" fill="#a78bfa" font-family="ui-monospace, monospace">40× share</text>
    <text x="160" y="48" font-size="11" fill="#b8c5db">(0.3% → 12.0% from 2023 to 2025)</text>
  </g>

  <!-- Lower-left annotation: definition -->
  <g transform="translate(60, 520)">
    <text font-size="13" font-weight="600" fill="#36e1ff" font-family="ui-monospace, monospace">DEFINITION</text>
    <text y="22" font-size="11" fill="#b8c5db">AI-generated = account whose profile pictures, content,</text>
    <text y="38" font-size="11" fill="#b8c5db">or interactions are produced via generative AI (image, video, chat).</text>
    <text y="54" font-size="11" fill="#7c8aa3">Detection: image-fingerprinting + LLM-style detection on profile bios.</text>
  </g>

  <!-- Branding -->
  <text x="1140" y="614" text-anchor="end" font-size="11" font-weight="600" fill="#36e1ff" font-family="ui-monospace, monospace">onlyfansstatistics.com/research/ai-creators-12-percent</text>
</svg>
