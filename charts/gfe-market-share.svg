<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" role="img" aria-label="Girlfriend Experience market: digital vs physical 2023 to 2025"><metadata><x:xmpmeta xmlns:x="adobe:ns:meta/" x:xmptk="onlyfansstatistics.com embed-image-metadata"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"><rdf:Description rdf:about="" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/" xmlns:photoshop="http://ns.adobe.com/photoshop/1.0/" xmlns:plus="http://ns.useplus.org/ldf/xmp/1.0/" xmlns:Iptc4xmpCore="http://iptc.org/std/Iptc4xmpCore/1.0/xmlns/" xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/" xmlns:cc="http://creativecommons.org/ns#" xmlns:xmp="http://ns.adobe.com/xap/1.0/" xmp:CreatorTool="onlyfansstatistics.com chart builder" photoshop:Credit="onlyfansstatistics.com" photoshop:Source="https://onlyfansstatistics.com/research/digital-intimacy-economy-2025" xmpRights:Marked="True" xmpRights:WebStatement="https://onlyfansstatistics.com/license" Iptc4xmpExt:DigitalSourceType="http://cv.iptc.org/newscodes/digitalsourcetype/dataDrivenMedia" cc:license="https://creativecommons.org/licenses/by-sa/4.0/" cc:attributionName="onlyfansstatistics.com" cc:attributionURL="https://onlyfansstatistics.com/research/digital-intimacy-economy-2025"><dc:title><rdf:Alt><rdf:li xml:lang="x-default">OnlyFans gFE</rdf:li></rdf:Alt></dc:title><dc:description><rdf:Alt><rdf:li xml:lang="x-default">GFE (Girlfriend Experience) market share 2023-2025: OnlyFans Couples/GFE niche grew from $420M to $710M; premium companionship dolls grew from $310M to $580M</rdf:li></rdf:Alt></dc:description><dc:creator><rdf:Seq><rdf:li>onlyfansstatistics.com</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 onlyfansstatistics.com · CC BY-SA 4.0</rdf:li></rdf:Alt></dc:rights><dc:subject><rdf:Bag><rdf:li>OnlyFans</rdf:li><rdf:li>OnlyFans statistics</rdf:li><rdf:li>OnlyFans gfe market share</rdf:li><rdf:li>OnlyFans vs Sex Dolls: The Hidden $16B Industry Map (2025)</rdf:li><rdf:li>market</rdf:li><rdf:li>share</rdf:li><rdf:li>creator economy</rdf:li><rdf:li>2026</rdf:li><rdf:li>data visualization</rdf:li><rdf:li>chart</rdf:li></rdf:Bag></dc:subject><xmpRights:UsageTerms><rdf:Alt><rdf:li xml:lang="x-default">Free to reuse under CC BY-SA 4.0: credit onlyfansstatistics.com and link to the source page.</rdf:li></rdf:Alt></xmpRights:UsageTerms><plus:Licensor><rdf:Seq><rdf:li rdf:parseType="Resource"><plus:LicensorName>onlyfansstatistics.com</plus:LicensorName><plus:LicensorURL>https://onlyfansstatistics.com/license</plus:LicensorURL></rdf:li></rdf:Seq></plus:Licensor><Iptc4xmpCore:CreatorContactInfo rdf:parseType="Resource"><Iptc4xmpCore:CiUrlWork>https://onlyfansstatistics.com/</Iptc4xmpCore:CiUrlWork></Iptc4xmpCore:CreatorContactInfo></rdf:Description></rdf:RDF></x:xmpmeta></metadata>
  <title>Girlfriend Experience (GFE) market: digital vs physical 2023-2025</title>
  <desc>Stacked area chart of annual GFE-niche revenue 2023-2025 in USD millions, showing OnlyFans Couples/GFE niche growing from $420M to $710M (+69%) and premium companionship dolls growing from $310M to $580M (+87%), combined to $1.29B by 2025.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1424"/>
      <stop offset="100%" stop-color="#0d1a2e"/>
    </linearGradient>
    <linearGradient id="ofFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="dollFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="55" font-size="22" font-weight="700" fill="#e8eef9">Girlfriend Experience (GFE) market: digital vs physical 2023-2025</text>
  <text x="60" y="80" font-size="14" fill="#7c8aa3">Annual revenue per category · USD millions · GFE-niche only</text>

  <!-- Plot geometry:
       X: 2023=220, 2024=620, 2025=1020
       Y baseline: 460 (= $0)
       Y top: 130 (= $1,400M)
       Scale: 330 / 1400 = 0.2357 px per $M
       Stacked totals:
         2023: dolls 310 + OF 420 = 730 → OF top = 460 - 730*0.2357 = 460 - 172 = 288 ; dolls top = 460 - 310*0.2357 = 460 - 73 = 387
         2024: dolls 420 + OF 580 = 1000 → OF top = 460 - 1000*0.2357 = 460 - 236 = 224 ; dolls top = 460 - 420*0.2357 = 460 - 99 = 361
         2025: dolls 580 + OF 710 = 1290 → OF top = 460 - 1290*0.2357 = 460 - 304 = 156 ; dolls top = 460 - 580*0.2357 = 460 - 137 = 323
  -->

  <!-- Y-axis labels & grid lines -->
  <g font-size="12" fill="#7c8aa3" font-family="ui-monospace, monospace">
    <text x="55" y="135" text-anchor="end">$1,400M</text>
    <line x1="60" y1="130" x2="1140" y2="130" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="55" y="218" text-anchor="end">$1,050M</text>
    <line x1="60" y1="213" x2="1140" y2="213" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="55" y="300" text-anchor="end">$700M</text>
    <line x1="60" y1="295" x2="1140" y2="295" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="55" y="383" text-anchor="end">$350M</text>
    <line x1="60" y1="378" x2="1140" y2="378" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="55" y="465" text-anchor="end">$0M</text>
    <line x1="60" y1="460" x2="1140" y2="460" stroke="#1e2d44" stroke-width="1"/>
  </g>

  <!-- Dolls (bottom layer) area: from baseline up to dolls top -->
  <path d="M220,387 L620,361 L1020,323 L1020,460 L220,460 Z" fill="url(#dollFill)"/>
  <path d="M220,387 L620,361 L1020,323" fill="none" stroke="#a78bfa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- OnlyFans (top layer) area: from dolls top up to OF top -->
  <path d="M220,288 L620,224 L1020,156 L1020,323 L620,361 L220,387 Z" fill="url(#ofFill)"/>
  <path d="M220,288 L620,224 L1020,156" fill="none" stroke="#f472b6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data point dots and labels — OF -->
  <g>
    <circle cx="220" cy="288" r="6" fill="#f472b6" stroke="#0d1a2e" stroke-width="2.5"/>
    <text x="220" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#e8eef9" font-family="ui-monospace, monospace">$420M</text>

    <circle cx="620" cy="224" r="6" fill="#f472b6" stroke="#0d1a2e" stroke-width="2.5"/>
    <text x="620" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#e8eef9" font-family="ui-monospace, monospace">$580M</text>

    <circle cx="1020" cy="156" r="8" fill="#f472b6" stroke="#0d1a2e" stroke-width="2.5"/>
    <text x="1020" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#e8eef9" font-family="ui-monospace, monospace">$710M</text>
  </g>

  <!-- Data point dots and labels — dolls -->
  <g>
    <circle cx="220" cy="387" r="6" fill="#a78bfa" stroke="#0d1a2e" stroke-width="2.5"/>
    <text x="220" y="408" text-anchor="middle" font-size="13" font-weight="700" fill="#e8eef9" font-family="ui-monospace, monospace">$310M</text>

    <circle cx="620" cy="361" r="6" fill="#a78bfa" stroke="#0d1a2e" stroke-width="2.5"/>
    <text x="620" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="#e8eef9" font-family="ui-monospace, monospace">$420M</text>

    <circle cx="1020" cy="323" r="8" fill="#a78bfa" stroke="#0d1a2e" stroke-width="2.5"/>
    <text x="1020" y="307" text-anchor="middle" font-size="13" font-weight="700" fill="#e8eef9" font-family="ui-monospace, monospace">$580M</text>
  </g>

  <!-- Growth annotations -->
  <g font-family="ui-monospace, monospace">
    <text x="1100" y="160" font-size="12" font-weight="700" fill="#f472b6">+69% 24mo</text>
    <text x="1100" y="327" font-size="12" font-weight="700" fill="#a78bfa">+87% 24mo</text>
  </g>

  <!-- X-axis labels -->
  <g font-size="13" font-weight="600" fill="#b8c5db" font-family="ui-monospace, monospace">
    <text x="220" y="485" text-anchor="middle">2023</text>
    <text x="620" y="485" text-anchor="middle">2024</text>
    <text x="1020" y="485" text-anchor="middle">2025</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60, 510)" font-family="ui-monospace, monospace">
    <rect x="0" y="0" width="14" height="14" fill="#f472b6" rx="2"/>
    <text x="22" y="12" font-size="12" fill="#b8c5db">OnlyFans Couples / GFE niche</text>
    <rect x="240" y="0" width="14" height="14" fill="#a78bfa" rx="2"/>
    <text x="262" y="12" font-size="12" fill="#b8c5db">Premium companionship dolls</text>
  </g>

  <!-- Highlight callout: combined GFE economy -->
  <g transform="translate(720, 490)">
    <rect x="0" y="0" width="430" height="60" rx="10" fill="#1e2d44" stroke="#f472b6" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="20" y="26" font-size="13" font-weight="600" fill="#f472b6" font-family="ui-monospace, monospace">2025 COMBINED GFE ECONOMY</text>
    <text x="20" y="50" font-size="22" font-weight="800" fill="#f472b6" font-family="ui-monospace, monospace">$1.29B</text>
    <text x="120" y="50" font-size="12" fill="#b8c5db">digital + physical · GFE-niche only</text>
  </g>

  <!-- Bottom: attribution + branding -->
  <text x="60" y="585" font-size="11" fill="#7c8aa3">Source: onlyfansstatistics.com analysis · OF niche-revenue panel + companionship doll retailer disclosures</text>
  <text x="1140" y="585" text-anchor="end" font-size="11" font-weight="600" fill="#36e1ff" font-family="ui-monospace, monospace">onlyfansstatistics.com/research/digital-intimacy-economy-2025</text>
</svg>
