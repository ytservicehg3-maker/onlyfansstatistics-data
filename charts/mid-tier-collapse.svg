<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif"><title>Mid-tier OnlyFans creator median monthly income declining from $4</title><desc>Mid-tier OnlyFans creator median monthly income declining from $4,500 (2022) to $3,700 (2025), a 17.8% drop over 36 months</desc><metadata><x:xmpmeta xmlns:x="adobe:ns:meta/" x:xmptk="onlyfansstatistics.com embed-image-metadata"><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"><rdf:Description rdf:about="" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:xmpRights="http://ns.adobe.com/xap/1.0/rights/" xmlns:photoshop="http://ns.adobe.com/photoshop/1.0/" xmlns:plus="http://ns.useplus.org/ldf/xmp/1.0/" xmlns:Iptc4xmpCore="http://iptc.org/std/Iptc4xmpCore/1.0/xmlns/" xmlns:Iptc4xmpExt="http://iptc.org/std/Iptc4xmpExt/2008-02-29/" xmlns:cc="http://creativecommons.org/ns#" xmlns:xmp="http://ns.adobe.com/xap/1.0/" xmp:CreatorTool="onlyfansstatistics.com chart builder" photoshop:Credit="onlyfansstatistics.com" photoshop:Source="https://onlyfansstatistics.com/embed/mid-tier-collapse" xmpRights:Marked="True" xmpRights:WebStatement="https://onlyfansstatistics.com/license" Iptc4xmpExt:DigitalSourceType="http://cv.iptc.org/newscodes/digitalsourcetype/dataDrivenMedia" cc:license="https://creativecommons.org/licenses/by-sa/4.0/" cc:attributionName="onlyfansstatistics.com" cc:attributionURL="https://onlyfansstatistics.com/embed/mid-tier-collapse"><dc:title><rdf:Alt><rdf:li xml:lang="x-default">Mid-tier OnlyFans creator median monthly income declining from $4</rdf:li></rdf:Alt></dc:title><dc:description><rdf:Alt><rdf:li xml:lang="x-default">Mid-tier OnlyFans creator median monthly income declining from $4,500 (2022) to $3,700 (2025), a 17.8% drop over 36 months</rdf:li></rdf:Alt></dc:description><dc:creator><rdf:Seq><rdf:li>onlyfansstatistics.com</rdf:li></rdf:Seq></dc:creator><dc:rights><rdf:Alt><rdf:li xml:lang="x-default">© 2026 onlyfansstatistics.com · CC BY-SA 4.0</rdf:li></rdf:Alt></dc:rights><dc:subject><rdf:Bag><rdf:li>OnlyFans</rdf:li><rdf:li>OnlyFans statistics</rdf:li><rdf:li>OnlyFans mid tier collapse</rdf:li><rdf:li>Mid-Tier OnlyFans Creator Income Decline 2022-2025</rdf:li><rdf:li>The Mid-Tier Collapse: $10–$50 Subs Are Dying</rdf:li><rdf:li>Free OnlyFans Stats Widgets</rdf:li><rdf:li>tier</rdf:li><rdf:li>collapse</rdf:li><rdf:li>creator economy</rdf:li><rdf:li>2026</rdf:li><rdf:li>data visualization</rdf:li><rdf:li>chart</rdf:li></rdf:Bag></dc:subject><xmpRights:UsageTerms><rdf:Alt><rdf:li xml:lang="x-default">Free to reuse under CC BY-SA 4.0: credit onlyfansstatistics.com and link to the source page.</rdf:li></rdf:Alt></xmpRights:UsageTerms><plus:Licensor><rdf:Seq><rdf:li rdf:parseType="Resource"><plus:LicensorName>onlyfansstatistics.com</plus:LicensorName><plus:LicensorURL>https://onlyfansstatistics.com/license</plus:LicensorURL></rdf:li></rdf:Seq></plus:Licensor><Iptc4xmpCore:CreatorContactInfo rdf:parseType="Resource"><Iptc4xmpCore:CiUrlWork>https://onlyfansstatistics.com/</Iptc4xmpCore:CiUrlWork></Iptc4xmpCore:CreatorContactInfo></rdf:Description></rdf:RDF></x:xmpmeta></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1424"/>
      <stop offset="100%" stop-color="#0d1a2e"/>
    </linearGradient>
    <linearGradient id="declineFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f87171" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f87171" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="totalFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#36e1ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#36e1ff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="55" font-size="22" font-weight="700" fill="#e8eef9">Mid-tier OnlyFans creators: median monthly earnings</text>
  <text x="60" y="80" font-size="14" fill="#7c8aa3">$10–$50 subscription price band · 2022–2025 · USD</text>

  <!-- Y-axis labels & grid lines -->
  <!-- Range: $3500–$5000, with 5 horizontal lines -->
  <g font-size="12" fill="#7c8aa3" font-family="ui-monospace, monospace">
    <text x="55" y="130" text-anchor="end">$5,000</text>
    <line x1="60" y1="125" x2="1140" y2="125" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="55" y="200" text-anchor="end">$4,500</text>
    <line x1="60" y1="195" x2="1140" y2="195" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="55" y="270" text-anchor="end">$4,000</text>
    <line x1="60" y1="265" x2="1140" y2="265" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="55" y="340" text-anchor="end">$3,500</text>
    <line x1="60" y1="335" x2="1140" y2="335" stroke="#1e2d44" stroke-width="1" stroke-dasharray="2 4"/>
    <text x="55" y="410" text-anchor="end">$3,000</text>
    <line x1="60" y1="405" x2="1140" y2="405" stroke="#1e2d44" stroke-width="1"/>
  </g>

  <!-- Comparison line: platform-wide median (basically flat at ~$15/mo, but we show "all-creator average" as a reference band scaled here) -->
  <!-- Skip comparison band; keep focus on the mid-tier line. -->

  <!-- Decline area + line (mid-tier median) -->
  <!-- 2022: $4,500 → y = 195
       2023: $4,100 → y = 251
       2024: $3,950 → y = 272
       2025: $3,700 → y = 307 (interpolation: ($3700-$3000)/2000 * 280 from 405 baseline) -->
  <!-- Let's calculate precisely. y maps: $5000 → 125, $3000 → 405. (5000-3000)/280 = 7.14 per $100.
       $4500 → 405 - (4500-3000)/2000 * 280 = 405 - 210 = 195 ✓
       $4100 → 405 - (4100-3000)/2000 * 280 = 405 - 154 = 251 ✓
       $3950 → 405 - (3950-3000)/2000 * 280 = 405 - 133 = 272 ✓
       $3700 → 405 - (3700-3000)/2000 * 280 = 405 - 98 = 307 ✓
  -->
  <!-- X positions: 2022=180, 2023=460, 2024=740, 2025=1020 -->
  <path d="M180,195 L460,251 L740,272 L1020,307 L1020,405 L180,405 Z" fill="url(#declineFill)"/>
  <path d="M180,195 L460,251 L740,272 L1020,307" fill="none" stroke="#f87171" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data point dots and labels -->
  <g>
    <circle cx="180" cy="195" r="6" fill="#f87171" stroke="#0d1a2e" stroke-width="2.5"/>
    <text x="180" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#e8eef9" font-family="ui-monospace, monospace">$4,500</text>

    <circle cx="460" cy="251" r="6" fill="#f87171" stroke="#0d1a2e" stroke-width="2.5"/>
    <text x="460" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#e8eef9" font-family="ui-monospace, monospace">$4,100</text>
    <text x="460" y="290" text-anchor="middle" font-size="11" fill="#f87171" font-family="ui-monospace, monospace">−8.9%</text>

    <circle cx="740" cy="272" r="6" fill="#f87171" stroke="#0d1a2e" stroke-width="2.5"/>
    <text x="740" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#e8eef9" font-family="ui-monospace, monospace">$3,950</text>
    <text x="740" y="311" text-anchor="middle" font-size="11" fill="#f87171" font-family="ui-monospace, monospace">−3.7%</text>

    <circle cx="1020" cy="307" r="8" fill="#f87171" stroke="#0d1a2e" stroke-width="2.5"/>
    <text x="1020" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#e8eef9" font-family="ui-monospace, monospace">$3,700</text>
    <text x="1020" y="346" text-anchor="middle" font-size="11" fill="#f87171" font-family="ui-monospace, monospace">−6.3%</text>
  </g>

  <!-- X-axis labels -->
  <g font-size="13" font-weight="600" fill="#b8c5db" font-family="ui-monospace, monospace">
    <text x="180" y="438" text-anchor="middle">2022</text>
    <text x="460" y="438" text-anchor="middle">2023</text>
    <text x="740" y="438" text-anchor="middle">2024</text>
    <text x="1020" y="438" text-anchor="middle">2025</text>
  </g>

  <!-- Highlight callout: total decline -->
  <g transform="translate(720, 470)">
    <rect x="0" y="0" width="430" height="80" rx="10" fill="#1e2d44" stroke="#f87171" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="20" y="30" font-size="14" font-weight="600" fill="#f87171" font-family="ui-monospace, monospace">CUMULATIVE DECLINE</text>
    <text x="20" y="58" font-size="22" font-weight="800" fill="#f87171" font-family="ui-monospace, monospace">−17.8%</text>
    <text x="120" y="58" font-size="12" fill="#b8c5db">($4,500 → $3,700 over 36 months)</text>
  </g>

  <!-- Lower-left annotation: bracket definition -->
  <g transform="translate(60, 470)">
    <text font-size="13" font-weight="600" fill="#36e1ff" font-family="ui-monospace, monospace">DEFINITION</text>
    <text y="28" font-size="12" fill="#b8c5db">"Mid-tier" = creators with monthly subscription price between $10 and $50.</text>
    <text y="48" font-size="12" fill="#b8c5db">Median = the middle creator (half earn more, half less). Not the average.</text>
    <text y="68" font-size="12" fill="#7c8aa3">Source: agency creator-management panel surveys (3 firms, anonymized) + creator-tool data.</text>
  </g>

  <!-- Bottom: attribution + branding -->
  <text x="60" y="585" font-size="11" fill="#7c8aa3">Source: onlyfansstatistics.com analysis · panel data from 3 agency creator-management firms (anonymized)</text>
  <text x="1140" y="585" text-anchor="end" font-size="11" font-weight="600" fill="#36e1ff" font-family="ui-monospace, monospace">onlyfansstatistics.com/research/mid-tier-collapse</text>
</svg>
